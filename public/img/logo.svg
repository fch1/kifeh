<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Kifeh">
  <!-- Pastille : carré aux coins adoucis posé sur pointe (écho abstrait au zellige) -->
  <g transform="rotate(45 48 48)">
    <rect x="18" y="18" width="60" height="60" rx="20" fill="#17557E"/>
  </g>
  <!-- Le pin-quartier : trois points reliés (les voisins) formant le cœur du marqueur -->
  <g fill="#FAF7F1">
    <circle cx="48" cy="36" r="7.5"/>
    <circle cx="35" cy="57" r="7.5"/>
    <circle cx="61" cy="57" r="7.5"/>
    <path d="M48 36 L35 57 L61 57 Z" fill="none" stroke="#FAF7F1" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- Pointe du pin -->
  <path d="M48 92 L41 76 Q48 80 55 76 Z" fill="#17557E"/>
</svg>
