<!-- Feuille : filtres avancés -->

  <div class="handle"></div>
  <h2 data-i18n="filters_title"></h2>
  <label data-i18n="filter_types"></label>
  <div class="filter-types" role="group" data-i18n-aria="filter_types">
    <label class="checkbox-row"><input type="checkbox" class="fType" value="fire"> 🔥 <span data-i18n="type_fire"></span></label>
    <label class="checkbox-row"><input type="checkbox" class="fType" value="electricity"> ⚡ <span data-i18n="type_electricity"></span></label>
    <label class="checkbox-row"><input type="checkbox" class="fType" value="water"> 💧 <span data-i18n="type_water"></span></label>
    <label class="checkbox-row"><input type="checkbox" class="fType" value="internet"> 📶 <span data-i18n="type_internet"></span></label>
  </div>
  <!-- Le satellite est une SOURCE d'information, jamais un type d'incident :
       il vit dans les couches, pas dans les catégories. -->

  <select id="fStatus">
    <option value="" data-i18n="filter_status_all"></option>
    <option value="active" data-i18n="filter_status_active"></option>
    <option value="resolved" data-i18n="filter_status_resolved"></option>
  </select>
  <label for="fPeriod" data-i18n="filter_period"></label>
  <select id="fPeriod">
    <option value="" data-i18n="filter_period_all"></option>
    <option value="1" data-i18n="filter_1h"></option>
    <option value="3" data-i18n="filter_3h"></option>
    <option value="24" data-i18n="filter_24h"></option>
  </select>
  <label for="fSource" data-i18n="filter_source"></label>
  <select id="fSource">
    <option value="" data-i18n="filter_source_all"></option>
    <option value="citizen" data-i18n="filter_source_citizen"></option>

  <div class="row sheet-actions">

    <button class="btn" id="filterApply" data-i18n="apply"></button>

<!-- Feuille : liste -->

</div>

<!-- Feuille : « Suivre cette zone » — UN parcours : la valeur expliquée AVANT

<div class="sheet" id="alertSheet" role="dialog" aria-modal="true" data-i18n-aria="follow_zone_btn">
  <div class="handle"></div>
  <div id="followBody"></div>
</div>

<!-- Feuille : « Suivis » — les zones et incidents que la personne suit,

<div class="sheet" id="suivisSheet" role="dialog" aria-modal="true" data-i18n-aria="suivis_title">
  <div class="handle"></div>
  <h2 data-i18n="suivis_title"></h2>
  <div id="suivisBody"></div>
</div>

<!-- Feuille : « Mon statut de sécurité » accessible depuis l'accueil —

<div class="sheet" id="safetySheet" role="dialog" aria-modal="true" data-i18n-aria="safety_title">
  <div class="handle"></div>
  <h2 data-i18n="safety_title"></h2>

  <div id="safetySheetBody"></div>
</div>

<!-- Feuille : vigilance Météo-France (France) — état de la veille météo

<div class="sheet" id="vigSheet" role="dialog" aria-modal="true" data-i18n-aria="vig_sheet_aria">
  <div class="handle"></div>
  <div id="vigContent"></div>
</div>

<!-- Feuille : Situation autour de vous — le hub qui répond à « que se
     passe-t-il, suis-je concerné(e), que puis-je faire ? ». Contenu vivant
     rendu par renderSituationHub() (résumé, conditions, sécurité, liste). -->
<div class="sheet" id="situationSheet" role="dialog" aria-modal="true" data-i18n-aria="situation_title">
  <div class="handle"></div>
  <h2 data-i18n="situation_title"></h2>
  <div id="situationBody"></div>
  <div class="detail-links">
    <button class="btn secondary small-btn" id="btnList" data-i18n="list_btn"></button>

</div>

<!-- Feuille : Aide — urgences d'abord, puis comprendre, régler, légal. -->

  <div class="handle"></div>
  <h2 data-i18n="aide_title"></h2>
  <div id="aideBody"></div>
</div>

<!-- Feuille : zone brûlée Copernicus EFFIS — contour APPROXIMATIF du

     jamais une zone de danger actuelle, jamais une consigne. -->
<div class="sheet" id="burntSheet" role="dialog" aria-modal="true" data-i18n-aria="burnt_title">
  <div class="handle"></div>
  <div id="burntContent"></div>
</div>

<!-- Feuille : entrave routière Bison Futé — la signalisation sur place prime. -->
<div class="sheet" id="roadSheet" role="dialog" aria-modal="true" data-i18n-aria="layer_roads">
  <div class="handle"></div>
  <div id="roadContent"></div>
</div>

<!-- Feuille : Couches d'information — chaque couche affiche SA source et SA
     dernière mise à jour ; aucune couche secondaire n'est active d'office. -->
<!-- Calques v2 (maquette A « Groupes clairs », validée par le master §calques) :
     4 groupes lisibles, chaque ligne = icône + nom + source · heure + voyant
     de fraîcheur + interrupteur 44 px. Les IDs de contrôles sont INCHANGÉS. -->
<div class="sheet" id="layersSheet" role="dialog" aria-modal="true" data-i18n-aria="layers_btn_aria">
  <div class="handle"></div>
  <h2 data-i18n="layers_title"></h2>
  <p class="muted small" data-i18n="layers_sub"></p>
  <div role="group">
    <p class="lay-grp">👁️ <span data-i18n="lgrp_observed"></span></p>
    <label class="layer-row"><span class="lay-ico" aria-hidden="true">🛰️</span>
      <span class="lay-txt"><span class="lay-name" data-i18n="layer_sat"></span>
        <span class="muted lay-src" id="srcSat"></span>
        <span class="muted lay-src" data-i18n="sat_age_legend"></span></span>
      <input type="checkbox" id="fSatLayer" class="lay-sw"></label>
    <p class="lay-grp" id="grpBurnt" hidden>▨ <span data-i18n="lgrp_published"></span></p>
    <label class="layer-row" id="fBurntRow" hidden><span class="lay-ico" aria-hidden="true">🟫</span>
      <span class="lay-txt"><span class="lay-name" data-i18n="burnt_legend"></span>
        <span class="muted lay-src" id="srcBurnt"></span></span>
      <input type="checkbox" id="fBurntLayer" class="lay-sw"></label>
    <p class="lay-grp" id="grpWx" hidden>🌡️ <span data-i18n="lgrp_conditions"></span></p>
    <label class="layer-row" id="wxRow" hidden><span class="lay-ico" aria-hidden="true">🌡️</span>
      <span class="lay-txt"><span class="lay-name" data-i18n="wx_layer_btn"></span>
        <span class="muted lay-src" id="srcWx"></span></span>
      <input type="checkbox" id="fWxLayer" class="lay-sw"></label>
    <p class="lay-grp" id="grpRoads" hidden>🧭 <span data-i18n="lgrp_context"></span></p>
    <label class="layer-row" id="fRoadsRow" hidden><span class="lay-ico" aria-hidden="true">🚧</span>
      <span class="lay-txt"><span class="lay-name" data-i18n="layer_roads"></span>
        <span class="muted lay-src" id="srcRoads"></span></span>
      <input type="checkbox" id="fRoadsLayer" class="lay-sw"></label>
  </div>
  <p class="muted small" data-i18n="layers_note"></p>
  <p class="muted small" data-i18n="layers_absent_note"></p>
</div>

<!-- Contenu crawlable sans JavaScript (moteurs classiques, moteurs de réponse
     IA, lecteurs sans JS) : le même message que l'application — jamais un
     contenu différent de ce que voient les utilisateurs (aucun cloaking). -->
<noscript>
  <section style="max-width:640px;margin:1rem auto;padding:0 1rem;font-family:sans-serif">
    <h1>Kifeh كيفاه — la carte citoyenne des incidents en quasi temps réel</h1>
    <p>Kifeh cartographie en quasi temps réel les incidents locaux en Tunisie et en
    France : incendies, coupures d'électricité, coupures d'eau et pannes internet.
    Signalements citoyens confirmés par la communauté, détections thermiques
    satellite NASA FIRMS, zones brûlées Copernicus EFFIS et vigilance officielle
    Météo-France — chaque donnée porte sa source et son horodatage. Gratuit, sans
    compte, open source. Kifeh ne remplace jamais les secours : en cas de danger
    immédiat, appelez le 18 ou le 112 en France, le 198 en Tunisie.</p>
    <p dir="rtl" lang="ar">«كيفاه» خريطة مواطنية تعرض بشكل شبه لحظي الحوادث المحلية في
    تونس وفرنسا: حرائق، انقطاعات كهرباء وماء وإنترنت. تبليغات المواطنين مؤكّدة من
    المجتمع، وأرصاد حرارية بالأقمار الاصطناعية (NASA FIRMS)، ومناطق محترقة
    (Copernicus EFFIS). كل معطى يحمل مصدره وتوقيته. مجاني، دون حساب، مفتوح المصدر.
    كيفاه لا يعوّض مصالح النجدة أبدًا.</p>
