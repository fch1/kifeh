<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A4D">
<title>Kifeh كيفاه — incidents en temps réel : électricité, eau, incendie, internet</title>
<meta name="description" content="Carte citoyenne en temps réel des coupures d'électricité, coupures d'eau, incendies et pannes internet en Tunisie et en France. Signalez, confirmez, informez votre quartier. Bilingue français-arabe, open source.">
<link rel="canonical" href="https://kifeh.app/">
<link rel="alternate" hreflang="fr" href="https://kifeh.app/?lang=fr">
<link rel="alternate" hreflang="ar" href="https://kifeh.app/?lang=ar">
<link rel="alternate" hreflang="x-default" href="https://kifeh.app/">
<!-- Partage social (Open Graph / Twitter) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kifeh">
<meta property="og:title" content="Kifeh كيفاه — ce qui se passe autour de vous, en temps réel">
<meta property="og:description" content="Coupures d'électricité, coupures d'eau, incendies et pannes internet sur une seule carte citoyenne — Tunisie et France. Open source, bilingue FR/AR.">
<meta property="og:url" content="https://kifeh.app/">
<meta property="og:image" content="https://kifeh.app/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="fr_FR">
<meta property="og:locale:alternate" content="ar_TN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Kifeh كيفاه — incidents en temps réel">
<meta name="twitter:description" content="Électricité, eau, incendies, internet : la carte citoyenne des incidents en Tunisie et en France.">
<meta name="twitter:image" content="https://kifeh.app/img/og-image.png">
<link rel="manifest" href="site.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=marque4">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png?v=marque4">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=marque4">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Kifeh",
  "alternateName": "كيفاه",
  "url": "https://kifeh.app/",
  "description": "Plateforme citoyenne open source de signalement en temps réel des incidents locaux (électricité, eau, incendie, internet) en Tunisie et en France.",
  "applicationCategory": "UtilitiesApplication",
  "operatingSystem": "Web",
  "inLanguage": ["fr", "ar"],
  "isAccessibleForFree": true,
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
  "areaServed": [
    { "@type": "Country", "name": "Tunisie" },
    { "@type": "Country", "name": "France" }
  ],
  "sameAs": ["https://github.com/fch1/kifeh"]
}
</script>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/analytics.js"></script>
</head>
<body>
<div id="map" role="application" data-i18n-aria="map_aria"></div>

<div class="home-top">
  <div class="home-brandbar">
    <!-- Marque bilingue en Tunisie (« Kifeh كيفاه »), française en France (« Kifeh »). -->
    <span class="brand-name"><img src="img/logo.svg?v=marque4" alt=""> <bdi>Kifeh</bdi> <bdi id="brandArabic" class="brand-arabic">كيفاه</bdi></span>
    <span class="spacer"></span>
    <button class="country-switch" id="countrySwitch" type="button" data-i18n-aria="country_switch_aria"></button>
    <button class="lang-switch" type="button">العربية</button>
  </div>
  <div class="searchbox">
    <input id="search" type="text" inputmode="search" autocomplete="off"
           data-i18n-ph="search_ph" data-i18n-aria="search_aria">
    <!-- Ma position en un geste, directement depuis la barre de recherche
         (géolocalisation UNIQUEMENT sur action explicite, jamais en continu) -->
    <button class="search-locate" id="searchLocate" type="button" data-i18n-aria="my_position">📍</button>
    <div id="searchResults" class="search-results" role="listbox" hidden></div>
  </div>
  <!-- Les feux d'abord : « Incendie » est la PREMIÈRE catégorie. Elle réunit
       en une seule donnée les signalements citoyens ET les observations
       satellite (dédupliqués quand un signalement est corroboré). -->
  <!-- Bandeau météo (France) : la réponse « quel temps autour de moi ? »
       visible AU PREMIER REGARD — température, ressenti, vent orienté, ciel.
       Tappable → fiche « Conditions autour de moi ». -->
  <button class="wx-strip" id="wxStrip" type="button" hidden aria-haspopup="dialog"
          data-i18n-aria="cond_title"></button>
  <div class="chips" role="group" data-i18n-aria="filters_aria">
    <button class="chip" data-type="fire" aria-pressed="false">🔥 <span data-i18n="type_fire"></span></button>
    <button class="chip" data-type="electricity" aria-pressed="false">⚡ <span data-i18n="type_electricity"></span></button>
    <button class="chip" data-type="water" aria-pressed="false">💧 <span data-i18n="type_water"></span></button>
    <button class="chip" data-type="internet" aria-pressed="false">📶 <span data-i18n="type_internet"></span></button>
    <button class="chip" id="chipOngoing" aria-pressed="false" data-i18n="chip_ongoing"></button>
    <button class="chip" id="chipFilters" aria-pressed="false"><span data-i18n="chip_filters"></span><span class="chip-badge" id="filterBadge" hidden></span></button>
  </div>
</div>

<div class="home-bottom">
  <div class="wx-legend" id="wxLegend" hidden></div>
  <div class="counter" id="counter" role="status" aria-live="polite" data-i18n="loading"></div>
</div>

<!-- Boutons flottants sur la carte : position + couches d'information.
     Des ACTIONS DE CARTE, pas des destinations — elles vivent sur la carte. -->
<div class="map-fabs">
  <button class="fab" id="btnLocate" data-i18n-aria="my_position_aria">📍</button>
  <button class="fab" id="btnLayers" data-i18n-aria="layers_btn_aria">🗺️</button>
</div>

<!-- Navigation principale FIXE : cinq destinations, toujours visibles, jamais
     de défilement horizontal (revue UX : une rangée défilante cache ce qu'on
     ne fait pas glisser). « Signaler » au centre = l'action de la marque. -->
<nav class="bottom-nav" id="bottomNav" data-i18n-aria="nav_main_aria">
  <button class="nav-item" id="navMap" aria-current="page"><span class="nav-ico" aria-hidden="true">🗺️</span><span data-i18n="nav_map"></span></button>
  <button class="nav-item" id="navSituation"><span class="nav-ico" aria-hidden="true">🧭</span><span data-i18n="nav_situation"></span></button>
  <a class="nav-declare" id="navDeclare" href="declare.html" data-i18n-aria="declare_btn"><span class="nav-declare-plus" aria-hidden="true">＋</span><span data-i18n="nav_declare"></span></a>
  <button class="nav-item" id="btnAlerts" aria-pressed="false" data-i18n-aria="suivis_title"><span class="nav-ico" aria-hidden="true">⭐</span><span data-i18n="nav_suivis"></span></button>
  <button class="nav-item" id="navAide"><span class="nav-ico" aria-hidden="true">❓</span><span data-i18n="nav_aide"></span></button>
</nav>

<!-- Feuille : filtres avancés -->
<div class="sheet" id="filterSheet" role="dialog" aria-modal="true" data-i18n-aria="sheet_filters_aria">
  <div class="handle"></div>
  <h2 data-i18n="filters_title"></h2>
  <label data-i18n="filter_types"></label>
  <div class="filter-types" role="group" data-i18n-aria="filter_types">
    <label class="checkbox-row"><input type="checkbox" class="fType" value="fire"> 🔥 <span data-i18n="type_fire"></span></label>
    <label class="checkbox-row"><input type="checkbox" class="fType" value="electricity"> ⚡ <span data-i18n="type_electricity"></span></label>
    <label class="checkbox-row"><input type="checkbox" class="fType" value="water"> 💧 <span data-i18n="type_water"></span></label>
    <label class="checkbox-row"><input type="checkbox" class="fType" value="internet"> 📶 <span data-i18n="type_internet"></span></label>
  </div>
  <!-- Le satellite est une SOURCE d'information, jamais un type d'incident :
       il vit dans les couches, pas dans les catégories. -->
  <label data-i18n="filter_layers"></label>
  <div role="group">
    <label class="checkbox-row"><input type="checkbox" id="fSatLayer"> 🛰️ <span data-i18n="layer_sat"></span></label>
    <button class="btn secondary small-btn" id="btnWeather" hidden
            aria-pressed="false" data-i18n-aria="wx_layer_btn_aria">🌡️ <span data-i18n="wx_layer_btn"></span></button>
  </div>
  <label for="fStatus" data-i18n="filter_status"></label>
  <select id="fStatus">
    <option value="" data-i18n="filter_status_all"></option>
    <option value="active" data-i18n="filter_status_active"></option>
    <option value="resolved" data-i18n="filter_status_resolved"></option>
  </select>
  <label for="fPeriod" data-i18n="filter_period"></label>
  <select id="fPeriod">
    <option value="" data-i18n="filter_period_all"></option>
    <option value="1" data-i18n="filter_1h"></option>
    <option value="3" data-i18n="filter_3h"></option>
    <option value="24" data-i18n="filter_24h"></option>
  </select>
  <label for="fSource" data-i18n="filter_source"></label>
  <select id="fSource">
    <option value="" data-i18n="filter_source_all"></option>
    <option value="citizen" data-i18n="filter_source_citizen"></option>
    <option value="corroborated" data-i18n="filter_source_corroborated"></option>
  </select>
  <div id="fSatConfWrap">
    <label for="fSatConf" data-i18n="filter_sat_conf"></label>
    <select id="fSatConf">
      <option value="" data-i18n="filter_sat_conf_all"></option>
      <option value="high" data-i18n="filter_sat_conf_high"></option>
    </select>
  </div>
  <label class="checkbox-row" style="margin-top:.75rem"><input type="checkbox" id="liteToggle"> <span data-i18n="lite_toggle"></span></label>
  <p class="muted small" id="filterCount" aria-live="polite"></p>
  <p class="muted small" id="satSyncInfo" hidden></p>
  <!-- Accès discret au code source (bien public, open source) -->
  <p class="muted small"><a href="a-propos.html" data-i18n="about_link_label"></a> · <a class="repo-link" href="https://github.com/fch1/kifeh" target="_blank" rel="noopener" data-i18n="open_source_link"></a></p>
  <div class="row sheet-actions">
    <button class="btn secondary" id="filterReset" data-i18n="reset"></button>
    <button class="btn" id="filterApply" data-i18n="apply"></button>
  </div>
</div>

<!-- Feuille : liste -->
<div class="sheet" id="listSheet" role="dialog" aria-modal="true" data-i18n-aria="sheet_list_aria">
  <div class="handle"></div>
  <div class="row" style="align-items:center">
    <h2 style="flex:1" data-i18n="list_title"></h2>
    <select id="sortSelect" data-i18n-aria="sort_aria" style="flex:0 0 auto;width:auto;min-height:40px">
      <option value="time" data-i18n="sort_time"></option>
      <option value="near" data-i18n="sort_near"></option>
      <option value="severity" data-i18n="sort_severity"></option>
    </select>
  </div>
  <div id="savedZonesRow"></div>
  <div id="listContainer"></div>
</div>

<!-- Feuille : détail -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" data-i18n-aria="detail_aria">
  <div class="handle"></div>
  <div id="detailContent"></div>
</div>

<!-- Feuille : « Suivre cette zone » — UN parcours : la valeur expliquée AVANT
     toute permission navigateur, rayon choisi, canal (notifications / e-mail),
     puis état de réussite avec notification de test. -->
<div class="sheet" id="alertSheet" role="dialog" aria-modal="true" data-i18n-aria="follow_zone_btn">
  <div class="handle"></div>
  <div id="followBody"></div>
</div>

<!-- Feuille : « Suivis » — les zones et incidents que la personne suit,
     avec leur état de notification. Destination de premier rang. -->
<div class="sheet" id="suivisSheet" role="dialog" aria-modal="true" data-i18n-aria="suivis_title">
  <div class="handle"></div>
  <h2 data-i18n="suivis_title"></h2>
  <div id="suivisBody"></div>
</div>

<!-- Feuille : « Mon statut de sécurité » accessible depuis l'accueil —
     rattaché au feu le plus proche (< 30 km) sinon à la zone consultée. -->
<div class="sheet" id="safetySheet" role="dialog" aria-modal="true" data-i18n-aria="safety_title">
  <div class="handle"></div>
  <h2 data-i18n="safety_title"></h2>
  <p class="muted small" id="safetyCtxLine"></p>
  <div id="safetySheetBody"></div>
</div>

<!-- Feuille : vigilance Météo-France (France) — état de la veille météo
     officielle. Ouverte depuis la ligne d'état du résumé de zone ou depuis un
     marqueur ⚠️ de département en alerte. -->
<div class="sheet" id="vigSheet" role="dialog" aria-modal="true" data-i18n-aria="vig_sheet_aria">
  <div class="handle"></div>
  <div id="vigContent"></div>
</div>

<!-- Feuille : Situation autour de vous — le hub qui répond à « que se
     passe-t-il, suis-je concerné(e), que puis-je faire ? ». Contenu vivant
     rendu par renderSituationHub() (résumé, conditions, sécurité, liste). -->
<div class="sheet" id="situationSheet" role="dialog" aria-modal="true" data-i18n-aria="situation_title">
  <div class="handle"></div>
  <h2 data-i18n="situation_title"></h2>
  <div id="situationBody"></div>
  <div class="detail-links">
    <button class="btn secondary small-btn" id="btnList" data-i18n="list_btn"></button>
    <button class="btn secondary small-btn" id="btnSafety" data-i18n-aria="safety_title">🤍 <span data-i18n="safety_shortcut"></span></button>
  </div>
</div>

<!-- Feuille : Aide — urgences d'abord, puis comprendre, régler, légal. -->
<div class="sheet" id="aideSheet" role="dialog" aria-modal="true" data-i18n-aria="nav_aide">
  <div class="handle"></div>
  <h2 data-i18n="aide_title"></h2>
  <div id="aideBody"></div>
</div>

<!-- Feuille : choix du pays (première visite et bouton pays).
     Le pays est INDÉPENDANT de la langue : la France se consulte en arabe,
     la Tunisie en français. Jamais de géolocalisation sans action explicite. -->
<div class="sheet" id="countrySheet" role="dialog" aria-modal="true" data-i18n-aria="country_sheet_aria">
  <div class="handle"></div>
  <h2 data-i18n="country_q"></h2>
  <p class="muted small" data-i18n="country_intro"></p>
  <div class="country-options" role="group">
    <button class="btn secondary country-option" id="countryTN" type="button">🇹🇳 <span data-i18n="country_tn"></span></button>
    <button class="btn secondary country-option" id="countryFR" type="button">🇫🇷 <span data-i18n="country_fr"></span></button>
  </div>
  <button class="btn ghost small-btn" id="countryGeo" type="button" data-i18n="country_use_position"></button>
  <p class="muted small" id="countryGeoInfo" role="status" aria-live="polite"></p>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/map-common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
