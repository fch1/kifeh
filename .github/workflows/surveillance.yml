# Surveillance de production GRATUITE via GitHub Actions : toutes les 30 min,
# vérifie que kifeh.app répond, que la base est saine et que la synchronisation
# NASA n'est pas en erreur. En cas d'échec, GitHub envoie automatiquement un
# e-mail au propriétaire du dépôt (aucun service externe nécessaire).
name: Surveillance production

on:
  schedule:
    - cron: '*/30 * * * *'   # healthz : toutes les 30 min
    - cron: '15 */6 * * *'   # parcours navigateur : toutes les 6 h
  workflow_dispatch:

jobs:
  healthz:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vérifier /healthz
        run: |
          set -e
          # Tolérant aux redémarrages de déploiement : 3 tentatives espacées
          # de 30 s avant de déclarer une panne (l'alerte reste fiable).
          for i in 1 2 3; do
            H=$(curl -sS -m 20 --retry 2 https://kifeh.app/healthz) && \
              echo "$H" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null && break
            echo "tentative $i indisponible — nouvel essai dans 30 s"
            sleep 30
          done
          echo "$H"
          echo "$H" | python3 -c "
          import json, sys
          h = json.load(sys.stdin)
          assert h.get('ok') is True, 'healthz ok:false'
          assert h.get('incidents', 0) >= 0, 'compteur incidents absent'
          # TOUTES les sources actives sont surveillées (audit 28/07) — une
          # source non configurée/désactivée ne déclenche jamais de fausse panne.
          for name in ('firms', 'vigilance', 'effis', 'roads'):
              s = h.get(name) or {}
              assert s.get('hasError') is not True, f'{name} en erreur persistante'
          d = h.get('dfci') or {}
          if d.get('enabled'):
              assert d.get('referenceLoaded') is True, 'DFCI activé mais référentiel NON chargé'
          print('Production saine —', h['incidents'], 'incidents ;',
                'effis:', (h.get('effis') or {}).get('count'),
                '· routes:', (h.get('roads') or {}).get('count'),
                '· NASA:', (h.get('firms') or {}).get('detections'))
          "

  # Smoke test des VRAIS parcours (lecture seule) : /healthz prouve que le
  # serveur vit ; ce job prouve qu'une personne peut UTILISER Kifeh (carte,
  # Situation, Couches, arabe, déclaration disponible, PWA). Toutes les 6 h.
  parcours:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 */6 * * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parcours réels en production (lecture seule)
        run: PROD_URL=https://kifeh.app node tests/prod-smoke.mjs
