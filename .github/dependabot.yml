# Mises à jour de sécurité automatiques des dépendances npm (PR hebdomadaire).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dépendances"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
